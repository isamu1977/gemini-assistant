<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gemini Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Gemini Assistant</h1>
      <p class="subtitle">PoC &middot; inserts into Gemini, never sends</p>
    </header>

    <section class="status" id="status" data-state="idle">
      <span class="status-indicator" aria-hidden="true"></span>
      <span id="status-text">Idle</span>
    </section>

    <label for="prompt" class="prompt-label">Prompt</label>
    <textarea
      id="prompt"
      placeholder="Type the prompt to insert into Gemini…"
      rows="8"
      spellcheck="false"
      autocomplete="off"
    ></textarea>

    <div class="actions">
      <button id="insert-btn" type="button" class="primary">Insert Prompt</button>
      <button id="clear-btn" type="button" class="secondary">Clear</button>
    </div>

    <details class="info">
      <summary>Self-test</summary>
      <pre id="selftest"></pre>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
